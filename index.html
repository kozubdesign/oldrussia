<style>

*{box-sizing:border-box}
:root{--play-ref-w:871;--play-ref-h:895;--play-fit-w:1379;--play-scale:1;--q-img-w:800px;--q-img-h:446px;--q-img-ratio:642/358;--q-img-end-h:330px;--q-img-end-ratio:800/330;--play-plaque-tick-h:24px;--play-year-h:24px;--play-header-gap:14px}
body{background:#0a0604;background-image:radial-gradient(ellipse 85% 55% at 50% 100%,rgba(255,130,45,.2) 0%,transparent 58%),radial-gradient(ellipse 35% 28% at 12% 96%,rgba(255,110,35,.14) 0%,transparent 52%),radial-gradient(ellipse 35% 28% at 88% 96%,rgba(255,110,35,.14) 0%,transparent 52%),radial-gradient(ellipse at 50% 15%,#1a1208 0%,#0a0604 72%);color:#e8d4b0;font-family:"PT Serif","Times New Roman",serif;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;margin:0;padding:0;overflow:hidden}
.play-fit{display:flex;align-items:center;justify-content:center;width:calc(var(--play-fit-w) * 1px * var(--play-scale));height:calc(var(--play-ref-h) * 1px * var(--play-scale));max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:visible;flex-shrink:0;margin:auto}
.play-layout{position:relative;width:calc(var(--play-ref-w) * 1px);height:calc(var(--play-ref-h) * 1px);transform:scale(var(--play-scale));transform-origin:top left;filter:drop-shadow(0 22px 48px rgba(0,0,0,.75))}
.game-container{background:linear-gradient(180deg,rgba(255,180,90,.05) 0%,transparent 28%),repeating-linear-gradient(92deg,rgba(0,0,0,.04) 0,rgba(0,0,0,.04) 2px,transparent 2px,transparent 9px),linear-gradient(168deg,#3a2818 0%,#2a1c10 42%,#1a1008 100%);border:12px solid #120a06;outline:2px solid #7a6038;border-radius:9px;width:100%;height:100%;overflow:hidden;padding:15px 32px 30px;box-shadow:inset 0 0 90px rgba(255,150,60,.07),inset 0 0 140px rgba(0,0,0,.55),0 0 50px rgba(255,120,40,.12);position:relative;display:flex;flex-direction:column;z-index:1}
.plaques-rail{position:absolute;top:0;bottom:0;width:242px;display:flex;flex-direction:column;gap:8px;overflow-x:hidden;overflow-y:auto;padding:2px 2px 10px;scrollbar-width:thin;z-index:2;pointer-events:auto}
.plaques-rail-left{right:calc(100% + 12px);left:auto}
.plaques-rail-right{left:calc(100% + 12px);right:auto}

.plaque{background:linear-gradient(180deg,#342418 0%,#24180e 100%);border:1px solid #6a5030;border-radius:7px;padding:10px 11px 10px 13px;font-size:15px;line-height:1.25;color:#e8d4b0;box-shadow:inset 0 1px 0 rgba(255,200,120,.08),0 3px 10px rgba(0,0,0,.45);position:relative}
.plaque::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:radial-gradient(circle at 30% 30%,#c84838,#7a2018);box-shadow:0 0 6px rgba(200,60,40,.35)}
.plaque.good{border-color:#4a7040;background:linear-gradient(180deg,#2a3420 0%,#1c2414 100%)}
.plaque.good::before{background:radial-gradient(circle at 30% 30%,#88c060,#3a6828)}
.plaque.bad{border-color:#7a4030;background:linear-gradient(180deg,#3a2018 0%,#281410 100%)}
.plaque.bad::before{background:radial-gradient(circle at 30% 30%,#e05848,#8a2018)}
.plaque-title{font-weight:700;margin:0 0 4px;font-size:17px;line-height:1.2;overflow-wrap:anywhere;color:#f0e0c8;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.plaque-mods{font-size:15px;color:#c4a878;font-variant-numeric:tabular-nums;white-space:nowrap}
.plaque-mods .up{color:#98d878;font-weight:700}
.plaque-mods .down{color:#e87868;font-weight:700}
.plaque.plaque-flash{animation:plaqueFlash 1.15s ease;z-index:6;position:relative}
@keyframes plaqueFlash{

  100%{opacity:1;transform:none;box-shadow:inset 0 1px 0 rgba(255,200,120,.08),0 3px 10px rgba(0,0,0,.45)}
}

}

}
.game-container::before{content:"";position:absolute;top:9px;left:9px;right:9px;bottom:9px;border:none;pointer-events:none;border-radius:4px;z-index:0;box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.game-container::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:7px;background:linear-gradient(135deg,rgba(184,148,90,.35) 0,transparent 17px),linear-gradient(225deg,rgba(184,148,90,.35) 0,transparent 17px),linear-gradient(315deg,rgba(184,148,90,.35) 0,transparent 17px),linear-gradient(45deg,rgba(184,148,90,.35) 0,transparent 17px);z-index:0}

.game-container.playing .prompt-area{flex:1 1 0;min-height:0;height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 0 6px;gap:0;overflow:hidden}

.game-container.playing button.choice-btn{

}
.game-container:not(.playing):not(.ending) .game-footer{height:auto;min-height:0;padding-top:12px}
.game-container.playing .game-footer{justify-content:flex-end}
.game-container.playing .game-footer .next-btn{margin-top:0}
.game-container.playing.showing-result .game-footer{height:auto;min-height:0;justify-content:flex-end;padding-top:8px}

.game-container.playing.showing-result .question-box{display:none!important}

.game-container.playing.showing-result .result-box{margin:0;max-height:100%}

.year-strip{flex:0 0 auto;display:none;align-items:center;justify-content:space-between;gap:10px;height:var(--play-year-h);min-height:var(--play-year-h);margin:0 0 2px;z-index:2;pointer-events:none}

<script>
const GAME_TITLES=[
  "Слово смерда. Кровь на снегу",
  "Слово волости. Честь на сходе",
  "Слово дружинника. Сталь на мосту",
  "Слово крестьянина. Позор на ярмарке",
  "Слово холопа. Ярлык на земле",
  "Слово старосты. Серебро на столе",
  "Слово знахаря. Яд в ковше",
  "Слово боярина. Кнут на дворе",
  "Слово летописца. Имя в пепле",
  "Слово ордынца. Пепел на избе"
];
function applyGameTitle(){
  const t=GAME_TITLES[Math.floor(Math.random()*GAME_TITLES.length)];
  document.title=t;
  const el=document.getElementById("bootTitle");
  if(el){
    // Форматируем "Слово ... . ..." в две строки.
    const m=String(t||"").split(". ");
    const line1=(m[0]||"")+"."; // добавляем точку обратно
    const line2=m.slice(1).join(". ");
    el.replaceChildren(
      document.createTextNode(line1),
      document.createElement("br"),
      document.createTextNode(line2)
    );
  }
  return t;
}
applyGameTitle();
const names=["Богдан","Добрыня","Всеволод","Ярополк","Святослав","Владимир","Мстислав","Ростислав","Изяслав","Глеб","Борис","Юрий","Андрей","Микула","Ратибор","Жирослав","Путята","Творимир","Станимир","Бронислав","Вячеслав","Олег","Игорь","Роман","Василий","Пётр","Иван","Максим","Кирилл","Алексей","Дмитрий","Павел","Фома","Лука","Клим","Лазарь","Савва","Тихон","Фрол","Евстафий","Архип","Гордей","Евсей","Захар","Игнат","Кондрат","Макар","Назар","Прохор","Савелий"];

const epithets=[
  "Борзый","Пыжик","Сокол","Ворон","Лис","Медведь","Волк","Кот","Ерш","Сорока",
  "Гроза","Буян","Угрюмый","Зубатый","Хитрый","Лукавый","Тихий","Смелый","Рыжий","Чернявый",

  "Дикий","Дубовый","Березовый","Мороз","Пекло","Сверчок","Жаворонок","Соловейко","Кривой","Быстрый"
];
const SHORT_NICKNAMES=(nicknames||[]).filter(function(n){
  return String(n||"").length<=8;
});
function pickShortNickname(){
  const list=SHORT_NICKNAMES&&SHORT_NICKNAMES.length?SHORT_NICKNAMES:nicknames;

function animateValue(el,start,end,duration){
  if(start===end){el.textContent=end;return}
  const range=end-start,startTime=performance.now();
  function step(now){
    const progress=Math.min((now-startTime)/duration,1);
    const eased=1-Math.pow(1-progress,3);
    el.textContent=Math.round(start+range*eased);
    if(progress<1)requestAnimationFrame(step);else el.textContent=end;
  }
  requestAnimationFrame(step);
}

  // Делаем список кандидатов: сначала варианты вопроса (перемешать),
  // затем гарантированные fallback.
  const candidates=(fromQuestion.length?fromQuestion:FALLBACK_IMGS).slice();
  for(let i=candidates.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=candidates[i];candidates[i]=candidates[j];candidates[j]=t;
  }
  // fallback добавим хвостом (вдруг вопрос выбрал “не существующее” имя)
  candidates.push.apply(candidates,FALLBACK_IMGS);
  return candidates;
}
function showQuestionImage(q){

  const img=document.getElementById("qImage");
  const wrap=document.getElementById("qVisual");
  if(!img||!wrap) return;
  wrap.classList.remove("splash");
  wrap.classList.remove("end");
  wrap.style.display="block";

  let idx=0;
  function tryNext(){
    if(idx>=candidates.length){
      wrap.style.display="none";
      return;
    }
    const baseName=String(candidates[idx++]||"").trim();
    if(!baseName){ tryNext(); return; }
    img.alt=baseName;
    img.onload=function(){ wrap.style.display="block"; };
    img.onerror=function(){
      img.onerror=null;
      tryNext();
    };
    img.src=encodeURI("img/"+baseName+".jpg");
  }

  tryNext();
}

/** Плашки семьи: смерть, замужество, дружина, холопы и др. при смене статуса */
function considerFamilyPlaques(beforeFam){
  const gained=[];
  if(!beforeFam||!player.family) return gained;
  const now=player.family;
  function tryAdd(def){
    const p=addPlaque(def);
    if(p) gained.push(p);
  }
  ["wife","son","daughter","father"].forEach(function(role){
    if(now[role]===beforeFam[role]) return;
    removePlaquesByIds(FAMILY_STATUS_PLAQUE_IDS[role]||[]);
    const def=FAMILY_STATUS_PLAQUES[role]&&FAMILY_STATUS_PLAQUES[role][now[role]];
    if(def) tryAdd(def);
  });
  return gained;
}

function addChronicle(opt,q){
  // ключевые решения: сильный сдвиг или чёрное событие
  const impact=Math.abs(opt.hp)+Math.abs(opt.s)+Math.abs(opt.g);
  const isKey=impact>=12 || (q&&q.isBlack) || (opt.tags&&opt.tags.some(t=>["brave","nasilnik","nehoroshiy","merciful","zhuk"].includes(t)));
  if(!isKey) return;
  let line=opt.t.replace(/\.$/,"");
  if(line.length>48) line=line.slice(0,46)+"…";
  if(player.chronicle.length<8 && !player.chronicle.includes(line)){
    player.chronicle.push(line);
  }
}

function capitalizeWord(w){
  if(!w) return w;
  return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
}
function parsePlayerName(raw){
  let s=String(raw||"").replace(/\s+/g," ").trim();
  if(!s) return null;
  s=s.slice(0,36);
  if(!/^[A-Za-zА-Яа-яЁёІіЇїЄєҐґ][A-Za-zА-Яа-яЁёІіЇїЄєҐґ'’\- ]{1,35}$/.test(s)) return null;
  const parts=s.split(" ").filter(Boolean).map(capitalizeWord);
  if(parts.length<1) return null;
  if(parts[0].length<2||parts[parts.length-1].length<2) return null;
  return {name:parts[0], surname:parts.length>=2?parts.slice(1).join(" "):""};
}

function pickRandomNamePair(){
  let n="", tries=0;
  do{
    n=names[Math.floor(Math.random()*names.length)]||"Иван";
    tries++;
  }while(n.toLowerCase()==="станислав"&&tries<12);
  if(n.toLowerCase()==="станислав") n="Иван";
  // На старте случайно подставляем либо только имя, либо имя + фамилия.
  // Фамилия потом может быть заменена/перешита в "Имя + Кличка" логикой дальше.
  const includeSurname=Math.random()<0.5;
  if(!includeSurname) return n;
  const s=nicknames[Math.floor(Math.random()*nicknames.length)]||"Борзый";
  return n+" "+s;
}

function plaquePower(p){

  return Math.abs(p.hp|0)*2+Math.abs(p.s|0)*2+Math.abs(p.g|0)*2+4;
}

function isBadPlaque(p){

  if(hp<0&&g<=0) return true;
  if(s<0&&g<=0&&hp<=0) return true;

}

function addPlaque(def){
  if(!def||!def.id||!def.title) return null;
  if(!player.plaques) player.plaques=[];

  // Второй удар по тому же органу → полная потеря
  if(def.id==="one_eye" && player.plaques.some(function(p){ return p.id==="one_eye"; }))
    def={id:"blind",title:"Слепой",hp:-1,power:16};
  if(def.id==="one_hand" && player.plaques.some(function(p){ return p.id==="one_hand"; }))
    def={id:"no_hands",title:"Безрукий",hp:-1,power:16};
  if(def.id==="lame_leg" && player.plaques.some(function(p){ return p.id==="lame_leg"; }))
    def={id:"no_legs",title:"Безногий",hp:-1,power:16};

  // Усиление увечья: снять «половинную» плашку
  const upgrades={
    blind:["one_eye"],
    no_hands:["one_hand"],
    no_legs:["lame_leg"]
  };
  if(upgrades[def.id]){
    for(let i=player.plaques.length-1;i>=0;i--){
      if(upgrades[def.id].indexOf(player.plaques[i].id)>=0) player.plaques.splice(i,1);
    }
  }
  // Уже полная потеря — не ставим половинную
  if(def.id==="one_eye" && player.plaques.some(function(p){ return p.id==="blind"; })) return null;
  if(def.id==="one_hand" && player.plaques.some(function(p){ return p.id==="no_hands"; })) return null;
  if(def.id==="lame_leg" && player.plaques.some(function(p){ return p.id==="no_legs"; })) return null;
  if(player.plaques.some(function(p){ return p.id===def.id; })) return null;

  const p={
    id:def.id,
    title:def.title,
    hp:def.hp|0,
    s:def.s|0,
    g:def.g|0,
    power:plaquePower(def)
  };
  const sideBad=isBadPlaque(p);
  const sameSide=player.plaques.filter(function(x){ return isBadPlaque(x)===sideBad; });
  if(sameSide.length>=PLAQUE_SIDE_MAX){
    let weakIdx=player.plaques.indexOf(sameSide[0]);
    let weakPow=plaquePower(sameSide[0]);
    for(let i=1;i<sameSide.length;i++){
      const pow=plaquePower(sameSide[i]);
      if(pow<weakPow){
        weakPow=pow;
        weakIdx=player.plaques.indexOf(sameSide[i]);
      }
    }
    if(p.power<=weakPow) return null;
    player.plaques.splice(weakIdx,1);
  }
  player.plaques.push(p);
  applyPlaqueStats(p);
  clampStats();
  return p;
}

function tickPlaques(){
  if(!player.plaques||!player.plaques.length) return null;
  const oH=player.hp|0,oS=player.silver|0,oG=player.glory|0;
  let triedHp=0,triedS=0,triedG=0;
  player.plaques.forEach(function(p){
    triedHp+=p.hp|0;
    triedS+=p.s|0;
    triedG+=p.g|0;
    applyPlaqueStats(p);
  });
  clampStats();
  const dH=player.hp-oH,dS=player.silver-oS,dG=player.glory-oG;
  if(!dH&&!dS&&!dG){
    if(!triedHp&&!triedS&&!triedG) return null;
    return {hp:0,s:0,g:0,blocked:true};
  }
  return {hp:dH,s:dS,g:dG};
}

function processTags(tags){
  if(!tags||!tags.length)return;
  tags.forEach(tag=>{
    if(!perkDefinitions[tag])return;
    player.perkCounts[tag]=(player.perkCounts[tag]||0)+1;
    const def=perkDefinitions[tag];
    if(player.perkCounts[tag]>=def.threshold){
      // Один перк: меняется на новый, старый уходит в историю
      if(player.currentPerk!==def.name){
        if(player.currentPerk&&!player.perkHistory.includes(player.currentPerk)){
          player.perkHistory.push(player.currentPerk);
        }
        player.currentPerk=def.name;
        if(!player.perkHistory.includes(def.name)){
          player.perkHistory.push(def.name);
        }
      }
    }
  });
  updatePerksDisplay();
}

  let dgFix=0;
  const lost=appliedG!=null?appliedG|0:opt.g|0;
  if(lost<0){
    player.glory-=lost; // откат фактической потери чести
    dgFix=-lost;
  }
  let bonus=0;
  if(opt.s>0) bonus=Math.max(2,Math.floor(opt.s*0.3));
  else bonus=3+Math.floor(Math.random()*5); // 3..7
  player.silver+=bonus;
  return {dh:0,ds:bonus,dg:dgFix,note:dirtyGetawayNote(),getaway:true};
}
function applyBadLuck(opt,tags){
  // публичный позор — только за явную подлость/насилие, не за трусость/жадность втихаря
  if(!tags||!tags.length)return null;
  const gloryGain=opt&&(opt.g|0)>0;
  const publicBad=tags.some(t=>t==="nehoroshiy"||t==="zhuk"||t==="nasilnik");
  const pettyBad=tags.some(t=>t==="greedy"||t==="coward");
  if(!publicBad&&!pettyBad)return null;
  if(Math.random()>=0.5)return null;
  if(publicBad&&!gloryGain){
    const roll=Math.random();
    if(roll<0.5){
      const dg=applyGloryDelta(-5, true);
      return {dh:0,ds:0,dg:dg,note:"Молва разнесла поступок — честь упала сильнее."};
    }else if(roll<0.8){
      const dg=applyGloryDelta(-8, true);
      const dh=applyHpDelta(-3, false);
      return {dh:dh,ds:0,dg:dg,note:"На сходе припомнили вслух: стыд ударил сильнее, чем ты ждал."};
    }else{
      const dg=applyGloryDelta(-3, true);
      const dsApplied=applySilverDelta(-4, false);
      return {dh:0,ds:dsApplied,dg:dg,note:"Пришлось откупаться серебром, иначе хула шла бы дальше."};
    }
  }
  // greedy/coward и «липовая» слава: хуже по кошельку/силам, без минуса к уже выросшей чести
  const roll=Math.random();
  if(roll<0.55){
    const dh=applyHpDelta(-2, true);
    return {dh:dh,ds:0,dg:0,note:gloryGain?"Почёт держится, зато силы сели от суеты вокруг липы.":"Вышло хуже: силы сели сильнее обычного."};
  }
  const ds=applySilverDelta(-3, true);
  return {dh:0,ds:ds,dg:0,note:ds?(gloryGain?"Дьяк косится — пришлось подмазать ещё серебром.":"Промах дороже: серебро утекло впустую."):"Промах дороже, но в кошельке и так пусто."};
}

function runBootSequence(done){
  clearBootTimer();
  const fill=document.getElementById("bootFill");
  const pctEl=document.getElementById("bootPct");
  const line=document.getElementById("bootLine");
  const steps=pickBootSteps();
  const duration=3400;
  setBootUI(true);
  if(line){
    line.classList.remove("show");
    line.textContent="";
  }
  if(pctEl) pctEl.textContent="0%";
  if(fill){
    fill.style.transition="none";
    fill.style.width="0%";
  }
  let lastIdx=-1;
  function showLine(text,immediate){
    if(!line) return;
    if(bootLineTimer){clearTimeout(bootLineTimer);bootLineTimer=null;}
    if(immediate||!line.textContent){
      line.textContent=text;
      requestAnimationFrame(function(){ line.classList.add("show"); });
      return;
    }
    line.classList.remove("show");
    bootLineTimer=setTimeout(function(){
      line.textContent=text;
      requestAnimationFrame(function(){ line.classList.add("show"); });
    },240);
  }
  const start=performance.now();
  function frame(now){
    const t=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-t,1.25);
    const p=Math.min(100,eased*100);
    if(fill) fill.style.width=p.toFixed(2)+"%";
    if(pctEl) pctEl.textContent=Math.round(p)+"%";
    let idx=0;
    for(let i=0;i<steps.length;i++){
      const from=i===0?0:steps[i-1].p;
      if(p>=from) idx=i;
    }
    if(idx!==lastIdx){
      const first=lastIdx<0;
      lastIdx=idx;
      showLine(steps[idx].t,first);
    }
    if(t<1){
      bootRaf=requestAnimationFrame(frame);
      return;
    }
    bootRaf=null;
    if(fill) fill.style.width="100%";
    if(pctEl) pctEl.textContent="100%";
    bootTimer=setTimeout(function(){
      if(line) line.classList.remove("show");
      bootTimer=setTimeout(function(){
        const boot=document.getElementById("bootLoad");
        const screen=document.getElementById("gameScreen");
        if(boot) boot.classList.remove("show");
        if(screen) screen.classList.remove("booting");
        if(done) done();
        else setBootUI(false);
      },280);
    },280);
  }
  bootRaf=requestAnimationFrame(frame);
}

function statColor(v){
  // >25 золото, ближе к 0 — краснее (палитра свечи)
  if(v>25) return "#e8c868";
  if(v<=0) return "#e85848";
  const t=v/25;
  const r=Math.round(220-t*30);
  const g=Math.round(90+t*110);
  const b=Math.round(35+t*25);
  return "rgb("+r+","+g+","+b+")";
}
function lerpRgb(c1,c2,t){
  function parse(hex){
    const h=String(hex).replace("#","");
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  }
  const a=parse(c1), b=parse(c2);
  const u=Math.max(0,Math.min(1,t));
  return "rgb("+
    Math.round(a[0]+(b[0]-a[0])*u)+","+
    Math.round(a[1]+(b[1]-a[1])*u)+","+
    Math.round(a[2]+(b[2]-a[2])*u)+")";
}
function avatarBorderColor(hp){
  const h=Math.max(0,hp|0);
  const green="#88c848", yellow="#e8a830", red="#d04030";
  if(h>20) return green;
  if(h>10) return lerpRgb(yellow,green,(h-10)/10);
  return lerpRgb(red,yellow,h/10);
}

function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
/** Викторины с закреплённым верным ответом — не больше пары за жизнь */
function isKnowledgeQuiz(q){
  if(!q||q.isBlack) return false;
  if(q.quiz) return true;
  return (q.opts||[]).some(function(o){ return o&&o.pinned; });
}
function pickLifeQuestions(pool, lifeLen){
  const maxQuiz=3;
  const shuffled=shuffleArray(pool);
  const quizzes=[];
  const story=[];
  shuffled.forEach(function(q){
    if(isKnowledgeQuiz(q)) quizzes.push(q);
    else story.push(q);
  });
  const takeQuiz=quizzes.slice(0, Math.min(maxQuiz, lifeLen, quizzes.length));
  const need=Math.max(0, lifeLen-takeQuiz.length);
  const takeStory=story.slice(0, Math.min(need, story.length));
  // если сюжетных мало — добираем викторинами
  let deck=takeQuiz.concat(takeStory);
  if(deck.length<lifeLen){
    const rest=quizzes.slice(takeQuiz.length);
    deck=deck.concat(rest.slice(0, lifeLen-deck.length));
  }
  return shuffleArray(deck).slice(0, lifeLen);
}

}

function pickOpts(opts,n){
  const list=Array.isArray(opts)?opts.filter(Boolean).filter(optAvailable):[];
  const want=n||4;
  const isHero=o=>o.extreme==="hero"||/^🦸/.test(o.t||"");
  const isVillain=o=>o.extreme==="villain"||/^😈/.test(o.t||"");
  const heroes=list.filter(isHero);
  const villains=list.filter(isVillain);
  const pinned=list.filter(o=>o.pinned&&!isHero(o)&&!isVillain(o));
  const normal=list.filter(o=>!isHero(o)&&!isVillain(o)&&!o.pinned);
  // Герой и подлец по отдельности, шанс 5% на каждого
  const special=[];
  if(heroes[0]&&Math.random()<0.05) special.push(heroes[0]);
  if(villains[0]&&Math.random()<0.05) special.push(villains[0]);
  const need=Math.max(0,want-special.length);
  const fill=shuffleArray(normal);
  let base=pinned.concat(fill).slice(0,need);
  // Если мало обычных (всё отфильтровали) — добираем из оставшихся не-extreme
  if(base.length<need){
    const rest=list.filter(o=>!isHero(o)&&!isVillain(o)&&base.indexOf(o)<0);
    base=base.concat(shuffleArray(rest)).slice(0,need);
  }
  return shuffleArray(special.concat(base)).slice(0,want);
}
function choiceBtnClass(opt){

  if(opt.extreme==="villain"||/^😈/.test(opt.t||"")) return "choice-btn villain-btn";

function clampStats(){
  if(isNaN(player.hp))player.hp=0;
  if(isNaN(player.silver))player.silver=0;
  if(isNaN(player.glory))player.glory=0;
  player.hp=Math.max(0,player.hp);
  player.silver=Math.max(0,player.silver);
  // честь ниже 0 — только после тяжёлого проступка; мелочь режется в applyGloryDelta
}
/** Мелочь (обида, отказ, глупость): не валит в могилу и не в изгои */
function isSoftHarm(opt,q){
  if(!opt) return true;
  if(opt.hardGlory||opt.extreme==="villain") return false;
  if(opt.softGlory) return true;
  if(isMedicalQuestion(q)) return true;
  const tags=opt.tags||[];
  if(tags.some(function(t){ return t==="nehoroshiy"||t==="zhuk"||t==="nasilnik"; })) return false;
  const dh=opt.hp|0;
  if(dh<=-12) return false; // тяжёлая рана/мор — может убить
  const impact=Math.abs(dh)+Math.abs(opt.s|0)+Math.abs(opt.g|0);
  if(impact<=14) return true;
  return false;
}
function applyHpDelta(dh, soft){
  dh=dh|0;
  if(!dh) return 0;
  if(dh>0){ player.hp+=dh; return dh; }
  if(!soft){ player.hp+=dh; return dh; }
  const before=player.hp|0;
  player.hp=Math.max(1, before+dh);
  return player.hp-before;
}
function applySilverDelta(ds, soft){
  ds=ds|0;
  if(!ds) return 0;
  if(ds>0){ player.silver+=ds; return ds; }
  if(!soft){ player.silver+=ds; return ds; }
  const before=player.silver|0;
  player.silver=Math.max(1, before+ds);
  return player.silver-before;
}
/** Тяжёлая потеря чести: обман, убийство, увечье, позор — может увести ниже 0 и кончить игру */
function isHardGloryLoss(opt, amount){
  const dg=amount|0;
  if(dg>=0) return false;
  if(opt&&opt.hardGlory) return true;
  if(opt&&opt.softGlory) return false;
  const tags=(opt&&opt.tags)||[];
  if(tags.some(function(t){ return t==="nehoroshiy"||t==="zhuk"||t==="nasilnik"; })) return true;
  if(opt&&opt.extreme==="villain") return true;
  if(dg<=-12) return true;
  const rt=(((opt&&opt.r)||"")+" "+((opt&&opt.t)||"")).toLowerCase();
  if(/убил|убить|заруб|повеш|избил|покалеч|ослеп|без руки|без ноги|одноглаз|ограб|опозор|проклял|лжесвид|насили|изнасило|сжёг жив|сжечь жив|вырвал глаз/.test(rt)) return true;
  if(/обманул|обман вскры|подсун|фальшив|фальш.*монет|солгал|предал|предательств/.test(rt)) return true;
  return false;
}
/** Мелкая потеря чести не уходит ниже 0; тяжёлая — может */
function applyGloryDelta(dg, hard){
  dg=dg|0;
  if(!dg) return 0;
  if(dg>0){ player.glory+=dg; return dg; }
  if(hard){ player.glory+=dg; return dg; }
  const before=player.glory|0;
  player.glory=Math.max(0, before+dg);
  return player.glory-before;
}

function resolveOpt(opt){
  if(!opt||!Array.isArray(opt.roll)||!opt.roll.length) return opt;
  let total=0;
  for(let i=0;i<opt.roll.length;i++) total+=Math.max(0,Number(opt.roll[i].w)||1);
  if(total<=0) return Object.assign({},opt,opt.roll[0]);
  let r=Math.random()*total;
  let picked=opt.roll[opt.roll.length-1];
  for(let i=0;i<opt.roll.length;i++){
    r-=Math.max(0,Number(opt.roll[i].w)||1);
    if(r<=0){picked=opt.roll[i];break;}
  }
  // roll-поля перекрывают базовые; t/tags с базы остаются, если в исходе не заданы
  const out=Object.assign({},opt,picked);
  delete out.roll;
  if(picked.tags) out.tags=picked.tags;
  else if(opt.tags) out.tags=opt.tags;
  return out;
}

  document.getElementById("historyBox").innerHTML="<strong>Историческая справка:</strong> "+q.history;
  document.getElementById("historyBox").style.display="block";
  document.getElementById("choicesBox").innerHTML="";

  if(player.hp<=0||player.silver<=0||player.glory<0||familyAllGone()){
    if(endGameTimer) clearTimeout(endGameTimer);
    endGameTimer=setTimeout(endGame,1800);
  } else {
    choiceLocked=false;
    document.getElementById("nextBtn").style.display="block";
  }
}

function nextQuestion(){

}

function escapeHtml(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function scoreOf(e){ return (e.hp|0)+(e.silver|0)+(e.glory|0); }
let fbDb=null;
let fbReady=false;
function firebaseConfigured(){
  const c=window.FIREBASE_CONFIG;
  return !!(c&&c.apiKey&&c.projectId&&c.apiKey.indexOf("YOUR_")!==0&&c.projectId.indexOf("YOUR_")!==0);
}
function initFirebase(){
  if(fbReady) return !!fbDb;
  fbReady=true;
  if(!firebaseConfigured()) return false;
  if(typeof firebase==="undefined") return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    fbDb=firebase.firestore();
    return true;
  }catch(e){
    console.warn("Firebase init failed",e);
    fbDb=null;
    return false;
  }
}
let chronicleCache=null;
let chronicleFetchPromise=null;
function chronicleLoadingHtml(msg){
  msg=msg||"Читаем летопись…";
  return '<div class="chronicle-wrap chronicle-loading-wrap"><div class="chronicle-title">Летопись игроков</div><div class="chronicle-loading"><div class="chronicle-load-bar" aria-hidden="true"><div class="chronicle-load-fill"></div></div><p class="chronicle-load-line">'+escapeHtml(msg)+'</p></div></div>';
}
function showChronicleLoading(slot,msg){
  if(!slot) slot=document.getElementById("chronicleSlot");
  if(slot) slot.innerHTML=chronicleLoadingHtml(msg);
}
function prefetchChronicle(){
  if(chronicleFetchPromise) return chronicleFetchPromise;
  const local=loadChronicleLocal();
  if(!initFirebase()){
    chronicleCache=local;
    chronicleFetchPromise=Promise.resolve(local);
    return chronicleFetchPromise;
  }
  chronicleFetchPromise=fetchChronicleRemote()
    .then(function(remote){
      const list=(remote&&remote.length)?remote:local;
      chronicleCache=list;
      if(remote&&remote.length) saveChronicleLocal(list);
      return list;
    })
    .catch(function(){
      chronicleCache=local;
      return local;
    });
  return chronicleFetchPromise;
}
function loadChronicleLocal(){
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(e){ return []; }
}
function saveChronicleLocal(list){
  try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(list)); }catch(e){}
}
function normalizeChronicleEntry(raw,idFallback){
  if(!raw||typeof raw!=="object") return null;
  const e={
    id:String(raw.id||idFallback||""),
    name:String(raw.name||""),
    surname:String(raw.surname||""),
    nickname:String(raw.nickname||""),
    job:String(raw.job||""),
    rank:String(raw.rank||""),
    age:raw.age|0,
    hp:raw.hp|0,
    silver:raw.silver|0,
    glory:raw.glory|0,
    iron:!!raw.iron,
    ts:raw.ts|0,
    score:raw.score!=null?raw.score|0:((raw.hp|0)+(raw.silver|0)+(raw.glory|0))
  };
  if(!e.id||!e.name) return null;
  return e;
}
function fetchChronicleRemote(){
  if(!initFirebase()||!fbDb) return Promise.resolve(null);
  return fbDb.collection("chronicle")
    .orderBy("score","desc")
    .limit(HISTORY_MAX)
    .get()
    .then(function(snap){
      const list=[];
      snap.forEach(function(doc){
        const e=normalizeChronicleEntry(doc.data(),doc.id);
        if(e) list.push(e);
      });
      return sortChronicle(list);
    });
}
function fetchChronicleRemoteTopMinScore(){
  // Берём минимальный score среди top-N (по сути, 50-е место в базе)
  if(!initFirebase()||!fbDb) return Promise.resolve(null);
  return fbDb.collection("chronicle")
    .orderBy("score","desc")
    .limit(HISTORY_MAX)
    .get()
    .then(function(snap){
      let lastScore=null;
      snap.forEach(function(doc){
        const d=doc.data()||{};
        const sc=(d.score!=null)?(d.score|0):((d.hp|0)+(d.silver|0)+(d.glory|0));
        lastScore=sc;
      });
      return lastScore;
    });
}
function pushChronicleRemote(entry){
  if(!initFirebase()||!fbDb) return Promise.resolve(false);
  const hp=Math.max(0,Math.min(500,entry.hp|0));
  const silver=Math.max(0,Math.min(2000,entry.silver|0));
  const glory=Math.max(-200,Math.min(1000,entry.glory|0));
  const payload={
    id:String(entry.id).slice(0,36),
    name:String(entry.name||"").slice(0,24),
    surname:String(entry.surname||"").slice(0,24),
    nickname:String(entry.nickname||"").slice(0,24),
    job:String(entry.job||"").slice(0,32),
    rank:String(entry.rank||"").slice(0,32),
    age:Math.max(12,Math.min(120,entry.age|0)),
    hp:hp,
    silver:silver,
    glory:glory,
    iron:!!entry.iron,
    ts:entry.ts|0,
    score:hp+silver+glory
  };
  return fbDb.collection("chronicle").doc(payload.id).set(payload)
    .then(function(){ return true; })
    .catch(function(err){
      console.warn("Firestore write failed",err);
      return false;
    });
}
function loadChronicle(){
  return loadChronicleLocal();
}
function saveChronicle(list){
  saveChronicleLocal(list);
}
function sortChronicle(list){
  return list.slice().sort(function(a,b){
    const ds=scoreOf(b)-scoreOf(a);
    if(ds) return ds;
    const dg=(b.glory|0)-(a.glory|0);
    if(dg) return dg;
    const dsil=(b.silver|0)-(a.silver|0);
    if(dsil) return dsil;
    return (b.ts|0)-(a.ts|0);
  });
}
function jobTitle(job,fallbackRank){
  const j=String(job||"").trim();
  if(!j) return fallbackRank||"Смерд";
  return j.charAt(0).toUpperCase()+j.slice(1);
}
function scoreWord(n){
  n=Math.abs(n|0);
  const m10=n%10,m100=n%100;
  if(m100>=11&&m100<=14) return "баллов";
  if(m10===1) return "балл";
  if(m10>=2&&m10<=4) return "балла";
  return "баллов";
}
function formatChronicleWho(e){
  return formatFullName(e);
}
const CHRONICLE_TIERS=[
  {from:1,cls:"tier-heroes",title:"🏆 Герои летописи",sub:"Имена, что помнят от Новгорода до Киева"},
  {from:11,cls:"tier-bogatyrs",title:"⚔️ Богатыри",sub:"Сила, честь и тяжёлая рука"},
  {from:21,cls:"tier-vityaz",title:"🛡️ Витязи волости",sub:"Держат слово и двор в порядке"},
  {from:31,cls:"tier-muzhiki",title:"🌾 Простые мужики",sub:"Пахали, терпели, дожили"},
  {from:41,cls:"tier-shame",title:"🐓 Позорники и плевальщики",sub:"В летопись попали — славы не принесли"}
];
function chronicleTierHtml(place){
  const tier=CHRONICLE_TIERS.find(function(t){ return t.from===place; });
  if(!tier) return "";
  return '<div class="chronicle-tier '+tier.cls+'">'+tier.title+'<span class="chronicle-tier-sub">'+tier.sub+'</span></div>';
}
function renderChronicleRow(e,place,me){
  const rank=e.rank||getRank(e.glory|0);
  const score=e.score!=null?e.score|0:scoreOf(e);
  const who=escapeHtml(formatChronicleWho(e));
  const meta=', '+escapeHtml(rank)+' '+(e.age|0)+' лет';
  let rowCls='chronicle-row';
  if(me) rowCls+=' me';
  if(place===1) rowCls+=' podium-gold';
  else if(place===2) rowCls+=' podium-silver';
  else if(place===3) rowCls+=' podium-bronze';
  let placeHtml='';
  if(place===1) placeHtml='<span class="chronicle-place medal-gold" aria-label="1 место">🥇</span>';
  else if(place===2) placeHtml='<span class="chronicle-place medal-silver" aria-label="2 место">🥈</span>';
  else if(place===3) placeHtml='<span class="chronicle-place medal-bronze" aria-label="3 место">🥉</span>';
  else placeHtml='<span class="chronicle-place">'+place+'</span>';
  return '<div class="'+rowCls+'"'+(me?' id="chronicleMe"':"")+'>'+
    '<div class="chronicle-row-left">'+
    placeHtml+
    '<span class="chronicle-score">'+score+' <span class="chronicle-score-label">'+scoreWord(score)+'</span></span> '+
    '<span class="chronicle-who"><span class="chronicle-who-name">'+who+'</span><span class="chronicle-who-meta">'+meta+'</span></span>'+
    '</div>'+
    '<div class="chronicle-row-stats">❤️'+(e.hp|0)+' 🪙'+(e.silver|0)+' 🏅'+(e.glory|0)+'</div>'+
    '</div>';
}
function chroniclePromptHtml(){
  return firebaseConfigured()
    ?'<p class="chronicle-prompt">Сохрани результат — он попадёт в общую летопись топ-'+HISTORY_MAX+'.</p>'
    :'<p class="chronicle-prompt">Сохрани результат — и сравнишь себя с другими в топ-'+HISTORY_MAX+'.</p>';
}
function chronicleRejectNoteHtml(){
  return '<p class="chronicle-prompt" style="color:#e87868;">'+CHRONICLE_REJECT_NOTE+'</p>';
}
function wouldEnterTop(list,entry){
  const merged=sortChronicle((list||[]).concat([entry]));
  const idx=merged.findIndex(function(e){ return e.id===entry.id; });
  return idx>=0 && idx<HISTORY_MAX;
}
function renderChronicleList(list,meId){
  if(!list.length){
    return '<div class="chronicle-wrap"><div class="chronicle-title">Летопись игроков</div><div class="chronicle-empty">Пока пусто — сохрани результат первым.</div></div>';
  }
  const rows=list.slice(0,HISTORY_MAX).map(function(e,i){
    const place=i+1;
    return chronicleTierHtml(place)+renderChronicleRow(e,place,e.id===meId);
  }).join("");
  const title=firebaseConfigured()
    ?'Летопись игроков · общая · топ-'+HISTORY_MAX+' по сумме ❤️+🪙+🏅'
    :'Летопись игроков · топ-'+HISTORY_MAX+' по сумме ❤️+🪙+🏅';
  return '<div class="chronicle-wrap" id="chronicleWrap"><div class="chronicle-title">'+title+'</div><div class="chronicle-list">'+rows+'</div></div>';
}
function writeToHistory(){
  if(historyWritten||!gameOver) return;
  const entry={
    id:"r"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    name:player.name,
    surname:player.surname||"",
    nickname:player.nickname,
    job:player.job||"",
    rank:getRank(player.glory),
    age:player.age,
    hp:player.hp|0,
    silver:player.silver|0,
    glory:player.glory|0,
    iron:!!player.iron,
    ts:Date.now(),
    score:scoreOf({hp:player.hp,silver:player.silver,glory:player.glory})
  };
  historyWritten=true;
  lastHistoryId=entry.id;
  showEndActions(true,"Сохраняем…");
  document.getElementById("gameScreen").classList.add("chronicle-open");
  showChronicleLoading(null,"Записываем в летопись…");

  function applyResult(baseList){
    const base=sortChronicle(baseList||[]);
    const admitted=wouldEnterTop(base,entry);
    let top=base.slice(0,HISTORY_MAX);
    if(admitted){
      top=sortChronicle(base.concat([entry])).slice(0,HISTORY_MAX);
      saveChronicleLocal(top);
      chronicleCache=top;
      showChronicleLoading(null,"Обновляем общую летопись…");
      const writePromise=pushChronicleRemote(entry);
      writePromise.then(function(ok){
        return fetchChronicleRemote().then(function(remote){
          if(remote&&remote.length){
            top=sortChronicle(remote).slice(0,HISTORY_MAX);
            saveChronicleLocal(top);
            chronicleCache=top;
          }
          const inList=top.some(function(e){ return e.id===entry.id; });
          fillChronicleSlot(inList?entry.id:null,false,top,!inList);
          showEndActions(true, inList?(ok||!firebaseConfigured()?"Результат сохранён":"Сохранено локально"):"Не вошёл в летопись");
          if(firebaseConfigured()&&!ok&&inList){
            const slot=document.getElementById("chronicleSlot");
            if(slot) slot.insertAdjacentHTML("beforeend",'<p style="font-size:13px;margin:6px 0 0;color:#e87868;">Общая база недоступна — запись осталась на этом устройстве.</p>');
          }
        });
      }).catch(function(){
        fillChronicleSlot(entry.id,false,top,false);
        showEndActions(true,"Сохранено локально");
      });
      return;
    }
    saveChronicleLocal(top);
    fillChronicleSlot(null,false,top,true);
    showEndActions(true,"Не вошёл в летопись");
  }

  prefetchChronicle().then(function(list){
    applyResult(list);
  }).catch(function(){
    applyResult(loadChronicleLocal());
  });
}
function showEndActions(written,label){
  const box=document.getElementById("choicesBox");
  if(!box) return;
  box.className="choices ending-actions";
  const writeBtn=written
    ?'<button class="choice-btn secondary" disabled>'+(label||"Результат сохранён")+'</button>'
    :'<button class="choice-btn secondary" onclick="writeToHistory()">Сохранить результат</button>';
  box.innerHTML=writeBtn+'<button class="choice-btn" onclick="location.reload()">Начать новую жизнь</button>';
}
function fillChronicleSlot(meId,promptSave,listOpt,rejected){
  const slot=document.getElementById("chronicleSlot");
  if(!slot) return;
  function paint(list){
    let note="";
    if(rejected){
      note=chronicleRejectNoteHtml();
    }else if(meId){
      const inList=(list||[]).some(function(e){ return e.id===meId; });
      if(!inList) note=chronicleRejectNoteHtml();
    }
    slot.innerHTML=renderChronicleList(list||[],meId)+note;
    if(!promptSave){
      const screen=document.getElementById("gameScreen");
      if(screen) screen.classList.add("chronicle-open");
    }
    const me=document.getElementById("chronicleMe");
    if(me){
      requestAnimationFrame(function(){
        const listEl=document.querySelector(".chronicle-list");
        if(listEl) listEl.scrollTop=Math.max(0,me.offsetTop-listEl.clientHeight/2);
      });
    }
  }
  if(promptSave){
    slot.innerHTML=chroniclePromptHtml();
    return;
  }
  if(listOpt){
    paint(sortChronicle(listOpt).slice(0,HISTORY_MAX));
    return;
  }
  if(chronicleCache){
    paint(sortChronicle(chronicleCache).slice(0,HISTORY_MAX));
    return;
  }
  showChronicleLoading(slot,"Читаем летопись…");
  prefetchChronicle().then(function(list){
    paint(sortChronicle(list).slice(0,HISTORY_MAX));
  });
}
function endGame(){
  if(gameOver) return;
  gameOver=true;choiceLocked=true;historyWritten=false;lastHistoryId=null;
  if(endGameTimer){clearTimeout(endGameTimer);endGameTimer=null;}
  hideNameGate();
  document.getElementById("gameScreen").classList.remove("playing");
  document.getElementById("gameScreen").classList.remove("showing-result");
  document.getElementById("gameScreen").classList.remove("chronicle-open");
  const destiny=getDestiny();
  const perkBit=player.perkHistory.length?(' За глаза называли: <i>'+player.perkHistory.join(', ')+'</i>.'):'';
  const nickLine='<p><b>'+escapeHtml(formatFullName())+'</b>, '+player.age+' '+yearsWord(player.age)+', '+getRank(player.glory)+'.'+perkBit+'</p>';
  document.getElementById("bioBox").style.display="none";
  document.getElementById("nameLine").style.display="none";
  setYearStripVisible(false);
  const mb=document.getElementById("modeBar"); if(mb) mb.style.display="none";
  const pitch=document.getElementById("pitchText"); if(pitch) pitch.style.display="none";
  const boot=document.getElementById("bootLoad"); if(boot) boot.classList.remove("show");
  document.getElementById("gameScreen").classList.remove("booting");
  document.getElementById("historyBox").style.display="none";
  document.getElementById("gameScreen").classList.add("ending");
  const qv=document.getElementById("qVisual");
  const img=document.getElementById("qImage");
  if(qv&&img){
    const baseName=getDestinyImage();
    qv.classList.remove("splash");
    qv.classList.add("end");
    img.onload=function(){ qv.style.display="block"; };
    img.onerror=function(){ img.onerror=null; qv.style.display="none"; };
    qv.style.display="block";
    img.src=encodeURI("img/"+baseName+".jpg");
    img.alt=baseName;
  }
  const famLine='<p>'+getFamilyStory()+'</p>';
  const ironNote=player.iron?'<p class="end-iron">Лютый век — слабее старт, подлость бьёт чаще</p>':'';
  const score=player.hp+player.silver+player.glory;
  document.getElementById("questionText").innerHTML='<div class="end-block"><div class="end-summary" id="endSummary">'+nickLine+ironNote+'<p>'+destiny+'</p>'+famLine+'<hr style="border:1px solid #6a5030;margin:8px auto;width:80%;"><p>Итоговые показатели:<br>❤️ <b>'+player.hp+'</b> &nbsp;|&nbsp; 🪙 <b>'+player.silver+'</b> &nbsp;|&nbsp; 🏅 <b>'+player.glory+'</b> · '+getRank(player.glory)+'<br><span class="end-score">Сумма для летописи: <b>'+score+'</b></span></p></div><div id="chronicleSlot"></div></div>';
  document.getElementById("questionText").style.display="";
  fillChronicleSlot(null,true);
  // Сверяемся с базой: если ниже минимального порога топ-50 — показываем надпись сразу
  (function(){
    const slot=document.getElementById("chronicleSlot");
    if(!slot||!firebaseConfigured()) return;
    fetchChronicleRemoteTopMinScore().then(function(minScore){
      if(minScore==null) return;
      if((score|0)<(minScore|0)){
        slot.insertAdjacentHTML("beforeend", chronicleRejectNoteHtml());
      }
    }).catch(function(){ /* silently ignore network/db errors */ });
  })();
  showEndActions(false);
  document.getElementById("resultBox").style.display="none";
  document.getElementById("nextBtn").style.display="none";
}
var PLAY_REF_W=871,PLAY_REF_H=895,PLAY_TOTAL_W=1379,PLAY_VIEW_PAD=24;
function fitPlayLayout(){
  var availH=window.innerHeight-PLAY_VIEW_PAD;
  var availW=window.innerWidth-PLAY_VIEW_PAD;
  var sH=availH/PLAY_REF_H;
  var sW=availW/PLAY_TOTAL_W;
  var s=Math.min(1,sH,sW);
  if(!isFinite(s)||s<=0) s=1;
  document.documentElement.style.setProperty("--play-scale",String(s));
  document.documentElement.style.setProperty("--play-fit-w",String(PLAY_TOTAL_W));
}
window.addEventListener("resize",fitPlayLayout);
window.addEventListener("orientationchange",fitPlayLayout);
fitPlayLayout();
prefetchChronicle();
startGame();
</script>
