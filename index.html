function animateValue(el,start,end,duration){
  if(start===end){el.textContent=end;return}
  const range=end-start,startTime=performance.now();
  function step(now){
    const progress=Math.min((now-startTime)/duration,1);
    const eased=1-Math.pow(1-progress,3);
    el.textContent=Math.round(start+range*eased);
    if(progress<1)requestAnimationFrame(step);else el.textContent=end;
  }
  requestAnimationFrame(step);
}

function showQuestionImage(text, isBlack){
  const baseName=getQuestionImage(text, isBlack);
  const img=document.getElementById("qImage");
  if(!img) return;
  // пути: img/name.jpg, img/name.png, name.jpg (рядом с index)
  // name, без нулей, короткий хвост после _ (vor, stroyka, kulachny_boy)
  const short=baseName.replace(/^\d+_/, "");
  const names=[baseName, baseName.replace(/^0+/, ""), short];
  const folders=["img/","images/",""];
  const exts=[".jpg",".png",".jpeg",".webp"];
  const candidates=[];
  const seen={};
  for(let f=0;f<folders.length;f++){
    for(let n=0;n<names.length;n++){
      if(!names[n]) continue;
      for(let e=0;e<exts.length;e++){
        const p=folders[f]+names[n]+exts[e];
        if(!seen[p]){ seen[p]=1; candidates.push(p); }
      }
    }
  }
  let attempt=0;
  img.style.display="block";
  img.onload=function(){ img.style.display="block"; };
  img.onerror=function(){
    attempt++;
    if(attempt<candidates.length){
      img.src=candidates[attempt];
    } else {
      img.style.display="none";
      if(window.console) console.warn("Нет картинки для:", text, "искали:", baseName);
    }
  };
  attempt=0;
  img.src=candidates[0];
  img.alt=baseName;
}

function addChronicle(opt,q){
  // ключевые решения: сильный сдвиг или чёрное событие
  const impact=Math.abs(opt.hp)+Math.abs(opt.s)+Math.abs(opt.g);
  const isKey=impact>=12 || (q&&q.isBlack) || (opt.tags&&opt.tags.some(t=>["brave","nasilnik","nehoroshiy","merciful","zhuk"].includes(t)));
  if(!isKey) return;
  let line=opt.t.replace(/\.$/,"");
  if(line.length>48) line=line.slice(0,46)+"…";
  if(player.chronicle.length<8 && !player.chronicle.includes(line)){
    player.chronicle.push(line);
  }
}

function processTags(tags){
  if(!tags||!tags.length)return;
  tags.forEach(tag=>{
    if(!perkDefinitions[tag])return;
    player.perkCounts[tag]=(player.perkCounts[tag]||0)+1;
    const def=perkDefinitions[tag];
    if(player.perkCounts[tag]>=def.threshold){
      // Один перк: меняется на новый, старый уходит в историю
      if(player.currentPerk!==def.name){
        if(player.currentPerk&&!player.perkHistory.includes(player.currentPerk)){
          player.perkHistory.push(player.currentPerk);
        }
        player.currentPerk=def.name;
        if(!player.perkHistory.includes(def.name)){
          player.perkHistory.push(def.name);
        }
      }
    }
  });
  updatePerksDisplay();
}
function applyBadLuck(tags){
  // 50/50: плохой поступок иногда оборачивается хуже
  // возвращает {dh,ds,dg,note} или null
  if(!tags||!tags.length)return null;
  const hasBad=tags.some(t=>badTags.has(t));
  if(!hasBad)return null;
  if(Math.random()>=0.5)return null;
  const roll=Math.random();
  if(roll<0.5){
    player.glory-=5;
    return {dh:0,ds:0,dg:-5,note:"Молва разнеслась хуже, чем ты ждал."};
  }else if(roll<0.8){
    player.glory-=8;
    player.hp-=3;
    return {dh:-3,ds:0,dg:-8,note:"Дело вышло наружу. Соседи отвернулись."};
  }else{
    player.glory-=3;
    const took=Math.min(4,player.silver);
    player.silver=Math.max(0,player.silver-4);
    return {dh:0,ds:-took,dg:-3,note:"Пришлось откупаться, чтобы замять историю."};
  }
}

function beginLife(){
  // читаем режимы в момент старта жизни (не при загрузке страницы)
  player.iron=!!(document.getElementById("ironMode")&&document.getElementById("ironMode").checked);
  player.skipHistory=!!(document.getElementById("skipHistory")&&document.getElementById("skipHistory").checked);
  if(player.iron){
    const extra=Math.max(0,player.silver-15);
    player.silver=15+Math.floor(extra*0.35);
    player.hp=Math.max(15,player.hp-5);
    const sum=player.hp+player.silver;
    player.glory=Math.max(15,100-sum);

  }

function statColor(v){
  // >25 зелёный, ближе к 0 — краснее
  if(v>25) return "#1a7a2a";
  if(v<=0) return "#8b1010";
  // 1..25: от оранжево-красного к жёлто-зелёному
  const t=v/25;
  const r=Math.round(180-t*120);
  const g=Math.round(40+t*120);
  const b=20;
  return "rgb("+r+","+g+","+b+")";
}
function paintStat(id,val){

function makeChoice(idx){
  const opt=window._currentOpts[idx];
  const q=availableQuestions[currentQuestionIndex];
  const oH=player.hp,oS=player.silver,oG=player.glory;
  player.hp+=opt.hp;player.silver+=opt.s;player.glory+=opt.g;
  if(isNaN(player.hp))player.hp=0;if(isNaN(player.silver))player.silver=0;if(isNaN(player.glory))player.glory=0;

  // Железная Русь: чаще доп. штраф
  let bad=null;
  if(player.iron){
    const oldRand=Math.random;
    // повысим шанс: временно подменим порог через повторный вызов логики
    bad=applyBadLuck(opt.tags||[]);
    if(!bad && opt.tags && opt.tags.some(t=>badTags.has(t)) && Math.random()<0.35){
      player.glory-=4;
      bad={dh:0,ds:0,dg:-4,note:"На Железной Руси ошибка дорого стоит."};
    }
  } else {
    bad=applyBadLuck(opt.tags||[]);
  }
  if(opt.family) applyFamilyChange(opt.family);
  // эвристика по тексту результата / варианта
  const rt=((opt.r||"")+" "+(opt.t||"")).toLowerCase();
  if(/отец не вышел|отца не стало|отец погиб/.test(rt)) applyFamilyChange({father:"мертв"});
  if(/семью увели|семья потеряна|семья в бегах/.test(rt)) applyFamilyChange({wife:"в бегах",son:"в бегах"});
  if(/жену прогнал|прогнал жену|жену с ребёнком/.test(rt)) applyFamilyChange({wife:"в бегах",son:"в бегах"});
  if(/сын ушёл с дружиной|отправил сына|сын ушёл/.test(rt)) applyFamilyChange({son:"в бегах"});
  if(/сына в холопы|забрать сына|сын в неволе|увели сына/.test(rt)) applyFamilyChange({son:"в бегах"});
  if(/сам вместо сына|взяли тебя на год|вместо сына/.test(rt)) applyFamilyChange({son:"цел"});
  if(/сын цел|сын остался дома|сын под родной/.test(rt)) applyFamilyChange({son:"цел"});
  if(/дочь ушла|дочь отдана|в наложницы/.test(rt)) {} // дочери нет в модели
  if(/убил любовника/.test(rt)) applyFamilyChange({wife:"больна"});
  if(/простить и.*ребёнка|принял ребёнка|усыновил/.test(rt)) applyFamilyChange({son:"цел"});
  if(/жена поругана/.test(rt)) applyFamilyChange({wife:"больна"});
  if(/мор.*близких|потерял близких/.test(rt)) applyFamilyChange({wife:"больна",son:"болен"});
  if(/сын.*ранен|сын.*болен|многие пали/.test(rt) && /бой|отряд|дружин/.test(rt)) applyFamilyChange({son:"болен"});
  processTags(opt.tags||[]);
  updateStatsWithAnimation(oH,oS,oG);
  document.getElementById("bioAge").innerText=player.age;

  function fmtDelta(n,label){
    if(n>0) return '<span class="delta-good">'+label+' +'+n+'</span>';
    if(n<0) return '<span class="delta-bad">'+label+' '+n+'</span>';
    return '<span class="delta-zero">'+label+' 0</span>';
  }
  const dH=opt.hp+(bad?bad.dh:0);
  const dS=opt.s+(bad?bad.ds:0);
  const dG=opt.g+(bad?bad.dg:0);
  const deltas=[fmtDelta(dH,'здоровье'),fmtDelta(dS,'серебро'),fmtDelta(dG,'почесть')].join(' · ');
  let resHtml="<strong>Что произошло:</strong> "+opt.r;
  if(bad) resHtml+=" "+bad.note;
  resHtml+="<br>("+deltas+")";
  document.getElementById("resultBox").innerHTML=resHtml;
  document.getElementById("resultBox").style.display="block";
  if(!player.skipHistory){
    document.getElementById("historyBox").innerHTML="<strong>Историческая справка:</strong> "+q.history;
    document.getElementById("historyBox").style.display="block";
  } else {
    document.getElementById("historyBox").style.display="none";
  }
  document.getElementById("choicesBox").innerHTML="";

  if(player.hp<=0||player.silver<=0||player.glory<0||familyAllGone())setTimeout(endGame,1800);
  else document.getElementById("nextBtn").style.display="block";
}

function endGame(){
  const destiny=getDestiny();
  const nickLine=player.perkHistory.length
    ?('<p style="margin:12px 0;font-size:17px;"><b>'+player.name+'</b> по прозвищу <b>'+player.nickname+'</b>, '+player.age+' лет.<br>За глаза называли: <i>'+player.perkHistory.join(', ')+'</i>.</p>')
    :('<p style="margin:12px 0;font-size:17px;"><b>'+player.name+'</b> по прозвищу <b>'+player.nickname+'</b>, '+player.age+' лет.</p>');
  document.getElementById("bioBox").style.display="none";
  document.getElementById("nameLine").style.display="none";
  document.getElementById("progressCounter").style.display="none";
  const qi=document.getElementById("qImage"); if(qi) qi.style.display="none";
  const fl=document.getElementById("familyLine"); if(fl) fl.style.display="none";
  const mb=document.getElementById("modeBar"); if(mb) mb.style.display="none";
  const yh=document.querySelector(".year-header"); if(yh) yh.style.display="none";
  const ye=document.getElementById("yearEvent"); if(ye) ye.style.display="none";
  const fam=player.family;
  const famLine='<p style="font-size:16px;">Семья: жена <b>'+fam.wife+'</b>, сын <b>'+fam.son+'</b>, отец <b>'+fam.father+'</b></p>';
  const ironNote=player.iron?'<p style="font-size:14px;color:#6b1a1a;">Режим: Железная Русь</p>':'';
  document.getElementById("questionText").innerHTML='<div class="end-block"><h2 class="end-title">📜 Летопись твоей жизни</h2>'+nickLine+ironNote+'<p style="font-size:17px;line-height:1.55;">'+destiny+'</p>'+famLine+'<hr style="border:1px solid #5c3d1e;margin:14px auto;width:80%;"><p style="font-size:17px;">Итоговые показатели:<br>Здоровье: <b>'+player.hp+'</b> &nbsp;|&nbsp; Серебро: <b>'+player.silver+'</b> &nbsp;|&nbsp; Почесть: <b>'+player.glory+'</b> · '+getRank(player.glory)+'</p></div>';
  document.getElementById("choicesBox").innerHTML='<button class="choice-btn" style="text-align:center;" onclick="location.reload()">Начать новую жизнь</button>';
  document.getElementById("resultBox").style.display="none";
  document.getElementById("historyBox").style.display="none";
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("shareBtn").style.display="block";
  window._shareText=player.name+' по прозвищу '+player.nickname+', '+player.age+' лет. '+(player.perkHistory.length?('За глаза называли: '+player.perkHistory.join(', ')+'. '):'')+destiny.replace(/[☠️💸🌟👑💰🏚️🛡️🌾📜🪙🩹👤🤝🧓🏡🌲🚫]/g,'')+' Здоровье '+player.hp+', серебро '+player.silver+', почесть '+player.glory+'. #ВыживаниеНаРуси';
}
function shareResult(){
  const text=window._shareText||'Я прожил жизнь на Руси!';
  if(navigator.share){
    navigator.share({title:'Выживание на Руси',text:text}).catch(function(){});
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      alert('Текст судьбы скопирован — вставь его в соцсеть!');
    }).catch(function(){
      prompt('Скопируй текст судьбы:',text);
    });
  }else{
    prompt('Скопируй текст судьбы:',text);
  }
}
startGame();
</script>
</body>
</html>
