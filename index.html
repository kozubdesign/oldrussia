<script>
const names=["Богдан","Добрыня","Всеволод","Ярополк","Святослав","Владимир","Мстислав","Ростислав","Изяслав","Глеб","Борис","Юрий","Андрей","Микула","Ратибор","Жирослав","Путята","Творимир","Станимир","Бронислав","Вячеслав","Олег","Игорь","Роман","Василий","Пётр","Иван","Максим","Кирилл","Алексей","Дмитрий","Павел","Фома","Лука","Клим","Лазарь","Савва","Тихон","Фрол","Евстафий","Архип","Гордей","Евсей","Захар","Игнат","Кондрат","Макар","Назар","Прохор","Савелий"];

const historyCores=["рос сиротой в глухом лесу и с детства приучен выживать среди дикого зверья","бежал от злого боярина из южных земель и обосновался на новом месте","сын зажиточного крестьянина, потерявший хозяйство во время весеннего паводка","бывший боевой холоп, получивший вольную за спасение боярина в сече","младший из семи братьев в семье смолокурщиков, знающий тайны лесного огня","племянник деревенского знахаря, с малолетства перенимавший секреты целебных трав","убежал из городского посада от учёбы у сурового и жадного мастера","чудом выжил после жестокой лихорадки, оставившей шрамы и несгибаемую волю","сын обедневшего дружинника, решивший попытать счастья мирным трудом","родился в год великой засухи и с тех пор привык ценить каждый колосок","много странствовал с караванами купцов и повидал чужие города и нравы","потерял избу от случайного пожара и теперь начинает жизнь с чистого листа","тихий и угрюмый малый, чьи руки способны вытесать из дерева любое чудо","задира и буян в прошлом, решивший остепениться и завести честное хозяйство","вырос у самой речной переправы и с ранних лет управлялся с тяжёлыми ладьями","служил сторожем на древнем городище, пока татары не сожгли укрепления","сын искусного бортника, знающий каждое дупло с диким мёдом наперечёт","сбежал от княжеской повинности в глухую волость под чужим именем","остался калекой на одну руку после кулачного боя, но не утратил сметки","всю юность помогал отцу ковать лемеха и чинить боевые топоры","ученик бродячего иконописца, ушедший от наставника искать свою дорогу","сирота, выросший при монастырской богадельне и обученный грамоте и счёту","сын заезжего варяга, осевшего на русской земле и принявшего местный уклад","пережил нападение разбойников, потерял семью, но сберёг отцовский меч","упрямый и молчаливый труженик, поднимающий заброшенный надел у оврага","бывший рыболов с озера Ильмень, пришедший искать удачи на великие реки","весёлый говорун, умеющий заговорить зубы любому княжьему приказчику","сын куз function animateValue(el,start,end,duration){
  if(start===end){el.textContent=end;return}
  const range=end-start,startTime=performance.now();
  function step(now){
    const progress=Math.min((now-startTime)/duration,1);
    const eased=1-Math.pow(1-progress,3);
    el.textContent=Math.round(start+range*eased);
    if(progress<1)requestAnimationFrame(step);else el.textContent=end;
  }
  requestAnimationFrame(step);
}


// Картинки задаются в questions.js (imgs[]) и у blackEvents; при нескольких — случайный выбор
const FALLBACK_IMGS=["в избе 1","семья","праздник","бедный крестьянин","сход мужчины"];
function pickImageName(q){
  const list=Array.isArray(q&&q.imgs)?q.imgs:(q&&q.img?[q.img]:[]);
  const pool=list.length?list:FALLBACK_IMGS;
  const name=pool[Math.floor(Math.random()*pool.length)];
  return String(name||FALLBACK_IMGS[0]).replace(/\.(jpg|jpeg|png|webp)$/i,"").trim();
}
function showQuestionImage(q){
  const baseName=pickImageName(q);
  const img=document.getElementById("qImage");
  const wrap=document.getElementById("qVisual");
  if(!img||!wrap) return;
  const src="img/"+baseName+".jpg";
  wrap.classList.remove("splash");
  wrap.classList.remove("end");
  img.onload=function(){ wrap.style.display="block"; };
  img.onerror=function(){
    img.onerror=null;
    wrap.style.display="none";
  };
  wrap.style.display="block";
  img.src=encodeURI(src);
  img.alt=baseName;
}


function pickYearEvent(y){
  const list=yearEvents[y];
  if(!list||!list.length) return "";
  return list[Math.floor(Math.random()*list.length)];
}
function updateYearEvent(){
  const el=document.getElementById("yearEvent");

function getRank(g){
  if(g<0) return "Изгой";
  if(g<15) return "Смерд";
  if(g<30) return "Огородник";
  if(g<45) return "Пахарь";
  if(g<60) return "Зажиточный";
  if(g<75) return "Десятник";
  if(g<90) return "Дружинник";
  if(g<110) return "Посадский";
  if(g<130) return "Боярин";
  if(g<155) return "Воевода";

}

function familyMemberGone(st){
  return /^(мертв|мертва|в бегах|прогнан|прогнана|в холопах|у боярина)$/.test(st||"");
}
function familyLost(){
  return familyAllGone();
}
function familyAllGone(){
  const f=player.family;
  return familyMemberGone(f.wife)&&familyMemberGone(f.son)&&familyMemberGone(f.daughter)&&familyMemberGone(f.father);
}
function updateFamilyDisplay(){
  const f=player.family;
  function cls(st){
    if(st==="цела"||st==="цел") return "ok";
    return "bad";
  }
  const el=document.getElementById("familyLine");
  if(!el) return;
  el.innerHTML="Семья: жена <span class=\""+cls(f.wife)+"\">"+f.wife+"</span> · сын <span class=\""+cls(f.son)+"\">"+f.son+"</span> · дочь <span class=\""+cls(f.daughter)+"\">"+f.daughter+"</span> · отец <span class=\""+cls(f.father)+"\">"+f.father+"</span>";
}
function applyFamilyChange(fam){
  if(!fam) return;
  Object.keys(fam).forEach(k=>{
    if(player.family[k]!==undefined) player.family[k]=fam[k];
  });
  updateFamilyDisplay();
}
function yearsWord(n){
  const n10=n%10,n100=n%100;

  return "лет";
}

function addChronicle(opt,q){
  // ключевые решения: сильный сдвиг или чёрное событие
  const impact=Math.abs(opt.hp)+Math.abs(opt.s)+Math.abs(opt.g);
  const isKey=impact>=12 || (q&&q.isBlack) || (opt.tags&&opt.tags.some(t=>["brave","nasilnik","nehoroshiy","merciful","zhuk"].includes(t)));
  if(!isKey) return;
  let line=opt.t.replace(/\.$/,"");
  if(line.length>48) line=line.slice(0,46)+"…";
  if(player.chronicle.length<8 && !player.chronicle.includes(line)){
    player.chronicle.push(line);
  }
}

function plaquePower(p){
  if(!p) return 0;
  if(p.power!=null) return p.power|0;
  return Math.abs(p.hp|0)*2+Math.abs(p.s|0)*2+Math.abs(p.g|0)*2+4;
}

function addPlaque(def){
  if(!def||!def.id||!def.title) return null;
  if(!player.plaques) player.plaques=[];
  if(player.plaques.some(function(p){ return p.id===def.id; })) return null;
  const p={
    id:def.id,
    title:def.title,
    why:def.why||"",
    hp:def.hp|0,
    s:def.s|0,
    g:def.g|0,
    power:plaquePower(def)
  };
  // Максимум 5 самых сильных перков
  if(player.plaques.length>=5){
    let weakIdx=0;
    for(let i=1;i<player.plaques.length;i++){
      if(plaquePower(player.plaques[i])<plaquePower(player.plaques[weakIdx])) weakIdx=i;
    }
    if(p.power<=plaquePower(player.plaques[weakIdx])) return null;
    player.plaques.splice(weakIdx,1);
  }
  player.plaques.push(p);
  // Сразу применить за текущий ход
  player.hp+=p.hp;player.silver+=p.s;player.glory+=p.g;
  clampStats();
  updatePlaquesDisplay();
  return p;
}
function tickPlaques(){
  if(!player.plaques||!player.plaques.length) return;
  player.plaques.forEach(function(p){
    player.hp+=p.hp|0;
    player.silver+=p.s|0;
    player.glory+=p.g|0;
  });
  clampStats();
  updateStats();
}
function considerPlaques(opt,q){
  // Сильные перки справа (макс. 5); «Жук» и т.п. — только у имени
  const gained=[];
  function tryAdd(def){ const p=addPlaque(def); if(p) gained.push(p); }
  if(opt&&opt.plaque){ tryAdd(opt.plaque); return gained; }

  const tags=opt.tags||[];
  const has=function(t){ return tags.indexOf(t)>=0; };
  const rt=((opt.r||"")+" "+(opt.t||"")+" "+((q&&q.text)||"")).toLowerCase();
  const impact=Math.abs(opt.hp|0)+Math.abs(opt.s|0)+Math.abs(opt.g|0);
  const isExtreme=!!opt.extreme;
  const isBlack=!!(q&&q.isBlack);

  // Нужен заметный исход или тег характера
  if(!isExtreme && !isBlack && impact<10 && !tags.length) return gained;

  const candidates=[];
  function cand(def){ if(def) candidates.push(def); }

  if(isExtreme&&opt.extreme==="hero")
    cand({id:"village_savior",title:"Спаситель деревни",why:"Встал за волость — село помнит имя",hp:1,g:2,power:14});
  if(isExtreme&&opt.extreme==="villain")
    cand({id:"cursed_name",title:"Проклятый",why:"Зло таково, что шепчут твоё имя",s:1,g:-2,power:13});

  if(/татар|орд|баскак|ясак|полон/.test(rt) && (has("zhuk")||has("nehoroshiy")||has("coward")) && (opt.g|0)<0)
    cand({id:"tatar_lackey",title:"Татарский прихвостень",why:"Продал своих орде — есть серебро",s:2,g:-2,power:12});
  if(/татар|орд|набег|осад|полон/.test(rt) && (has("brave")||has("merciful")||isExtreme) && (opt.g|0)>=6)
    cand({id:"village_savior",title:"Спаситель деревни",why:"Отбил беду — волость зовёт щитом",hp:1,g:2,power:14});

  if(/княз|дружин|ярлык|тиун|двор/.test(rt) && (opt.g|0)>=5 && !has("nehoroshiy"))
    cand({id:"prince_shield",title:"Под защитой князя",why:"Князь заметил — сила за спиной",s:1,g:2,power:13});

  if(/леч|знахар|лихорад|болн|мор|чум|трав|маз|исцел|зелье|отвар|бан/.test(rt) && ((opt.hp|0)>=6 || has("merciful") || has("pious")))
    cand({id:"healer",title:"Лекарь",why:"Лечил людей — зовут к больным",hp:2,g:1,power:12});

  if(has("greedy") && (opt.s|0)>=5)
    cand({id:"zhadoba",title:"Жадоба",why:"Хапал сверх меры — душа стынет",s:2,g:-2,power:11});

  if(has("coward") && (opt.g|0)<=-5)
    cand({id:"village_fool",title:"Деревенский дурачок",why:"Струсил так, что село смеётся",hp:-1,g:-2,power:9});

  if(has("pious") && (/церк|храм|поп|молит|пост|икон|монаст|бог/.test(rt) || (opt.g|0)>=4))
    cand({id:"faith_keeper",title:"Хранитель веры",why:"За храм стоял — попы поминают",hp:1,g:2,power:11});

  if(has("nasilnik") && ((opt.g|0)<=-6 || (opt.s|0)>=6))
    cand({id:"bloody_fist",title:"Кровавый кулак",why:"Брал силой — боятся открыть рот",s:1,g:-2,power:11});

  if((has("zhuk")||has("skolzkiy")) && (opt.s|0)>=4)
    cand({id:"road_swindler",title:"Дорожный плут",why:"Обманом живёт — в торге ищут ложь",s:2,g:-1,power:10});

  if(/пожар|огонь|плам|сжёг|сжечь/.test(rt) && (has("brave")||has("merciful")) && (opt.g|0)>=4)
    cand({id:"fire_saver",title:"Спаситель из огня",why:"Из огня таскал — слава и шрамы",hp:-1,g:2,power:12});

  if(/кабал|закуп|холоп|долг|тиун|дань|недоим/.test(rt) && (opt.s|0)<=-5)
    cand({id:"bond_slave",title:"Кабальный",why:"Кабала на шее — серебро утекает",s:-2,g:-1,power:10});

  if(has("brave") && (opt.g|0)>=5 && (opt.hp|0)<=-4)
    cand({id:"scarred_glory",title:"Шрам удальца",why:"Кровь пролил — слава не сходит",hp:-1,g:1,power:10});

  if(has("merciful") && (opt.g|0)>=3)
    cand({id:"warm_hearth",title:"Тёплый очаг",why:"Пощадил своих — дом даёт силы",hp:1,g:1,power:9});

  if(has("generous") && (opt.s|0)<=-4)
    cand({id:"open_hand",title:"Щедрая рука",why:"Отдал своё — о тебе говорят добром",g:1,s:-1,power:8});

  if(has("hardworker") && impact>=10)
    cand({id:"strong_back",title:"Крепкая спина",why:"Тяжкий труд — тело привыкло",hp:1,power:8});

  if(has("cunning") && (opt.s|0)>=3 && (opt.g|0)>=0)
    cand({id:"fox_mind",title:"Лисий ум",why:"Хитростью выгадал — ум цепок",s:1,power:8});

  if(has("nehoroshiy") && (opt.g|0)<=-6)
    cand({id:"bad_name",title:"Дурная слава",why:"Подлость не забывают — молва ест честь",g:-1,power:9});

  if(!candidates.length) return gained;

  // Не каждый раз: чаще при сильном/чёрном/крайнем выборе
  let chance=0.42;
  if(isExtreme) chance=1;
  else if(isBlack) chance=0.72;
  else if(impact>=20) chance=0.58;
  else if(impact<12) chance=0.28;
  if(Math.random()>chance) return gained;

  candidates.sort(function(a,b){ return plaquePower(b)-plaquePower(a); });
  tryAdd(candidates[0]);
  return gained;
}
function processTags(tags){
  if(!tags||!tags.length)return;
  tags.forEach(tag=>{
    if(!perkDefinitions[tag])return;
    player.perkCounts[tag]=(player.perkCounts[tag]||0)+1;
    const def=perkDefinitions[tag];
    if(player.perkCounts[tag]>=def.threshold){
      // Один перк: меняется на новый, старый уходит в историю
      if(player.currentPerk!==def.name){
        if(player.currentPerk&&!player.perkHistory.includes(player.currentPerk)){
          player.perkHistory.push(player.currentPerk);
        }
        player.currentPerk=def.name;
        if(!player.perkHistory.includes(def.name)){
          player.perkHistory.push(def.name);
        }
      }
    }
  });
  updatePerksDisplay();
}
function dirtyGetawayChance(){
  // 15%..30%: богаче и лукавее — чаще сходит с рук
  const wealth=Math.min(1,Math.max(0,player.silver)/80);
  const sneak=Math.min(1,((player.perkCounts.zhuk||0)+(player.perkCounts.cunning||0)+(player.perkCounts.skolzkiy||0))/8);
  return 0.15+0.15*(0.5*wealth+0.5*sneak);
}
function applyDirtyGetaway(opt,tags){
  // Подлый поступок иногда даёт прибыль без потери чести
  if(!opt||!tags||!tags.length) return null;
  if(!tags.some(t=>badTags.has(t))) return null;
  if(Math.random()>=dirtyGetawayChance()) return null;
  let dgFix=0;
  if(opt.g<0){
    player.glory-=opt.g; // откат потери чести
    dgFix=-opt.g;
  }
  let bonus=0;
  if(opt.s>0) bonus=Math.max(2,Math.floor(opt.s*0.3));
  else bonus=3+Math.floor(Math.random()*5); // 3..7
  player.silver+=bonus;
  const notes=[
    "Сошло с рук: поживился, а молва будто оглохла.",
    "Следы замели серебром и тишиной — честь цела, кошель тяжёл.",
    "Подлость окупилась без шума: никто не связал дело с тобой."
  ];
  return {dh:0,ds:bonus,dg:dgFix,note:notes[Math.floor(Math.random()*notes.length)],getaway:true};
}
function applyBadLuck(tags){
  // плохой поступок иногда оборачивается хуже (если не «сошло с рук»)
  if(!tags||!tags.length)return null;
  const hasBad=tags.some(t=>badTags.has(t));
  if(!hasBad)return null;
  if(Math.random()>=0.5)return null;
  const roll=Math.random();
  if(roll<0.5){
    player.glory-=5;
    return {dh:0,ds:0,dg:-5,note:"Молва разнеслась хуже, чем ты ждал."};
  }else if(roll<0.8){
    player.glory-=8;
    player.hp-=3;
    return {dh:-3,ds:0,dg:-8,note:"Дело вышло наружу. Соседи отвернулись."};
  }else{
    player.glory-=3;
    const took=Math.min(4,player.silver);
    player.silver=Math.max(0,player.silver-4);
    return {dh:0,ds:-took,dg:-3,note:"Пришлось откупаться, чтобы замять историю."};
  }
}

function statColor(v){
  // >25 зелёный, ближе к 0 — краснее
  if(v>25) return "#1a7a2a";
  if(v<=0) return "#8b1010";
  // 1..25: от оранжево-красного к жёлто-зелёному
  const t=v/25;
  const r=Math.round(180-t*120);
  const g=Math.round(40+t*120);
  const b=20;
  return "rgb("+r+","+g+","+b+")";
}

function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function pickOpts(opts,n){
  const list=Array.isArray(opts)?opts.filter(Boolean):[];
  const want=n||4;
  const isHero=o=>o.extreme==="hero"||/^🦸/.test(o.t||"");
  const isVillain=o=>o.extreme==="villain"||/^😈/.test(o.t||"");
  const heroes=list.filter(isHero);
  const villains=list.filter(isVillain);
  const pinned=list.filter(o=>o.pinned&&!isHero(o)&&!isVillain(o));
  const normal=list.filter(o=>!isHero(o)&&!isVillain(o)&&!o.pinned);
  // Герой и подлец по отдельности, шанс 5% на каждого
  const special=[];
  if(heroes[0]&&Math.random()<0.05) special.push(heroes[0]);
  if(villains[0]&&Math.random()<0.05) special.push(villains[0]);
  const need=Math.max(0,want-special.length);
  const pool=shuffleArray(pinned.concat(shuffleArray(normal)));
  return shuffleArray(special.concat(pool.slice(0,need))).slice(0,want);
}
function choiceBtnClass(opt){
  if(!opt) return "choice-btn";
  if(opt.extreme==="hero"||/^🦸/.test(opt.t||"")) return "choice-btn hero-btn";
  if(opt.extreme==="villain"||/^😈/.test(opt.t||"")) return "choice-btn villain-btn";
  return "choice-btn";
}
function clampStats(){
  if(isNaN(player.hp))player.hp=0;
  if(isNaN(player.silver))player.silver=0;
  if(isNaN(player.glory))player.glory=0;
  player.hp=Math.max(0,player.hp);
  player.silver=Math.max(0,player.silver);
}
function showQuestion(){
  if(gameOver) return;
  choiceLocked=false;
  if(currentQuestionIndex>=availableQuestions.length||currentYear>1389||player.hp<=0||player.silver<=0||player.glory<0||familyAllGone()){endGame();return}
  updateProgress();
  document.getElementById("year").innerText=currentYear;
  updateYearEvent();
  document.getElementById("bioAge").innerText=player.age;
  const q=availableQuestions[currentQuestionIndex];
  document.getElementById("questionText").innerText=q.text;
  showQuestionImage(q);
  const shuffled=pickOpts(q.opts,4);
  window._currentOpts=shuffled;
  document.getElementById("choicesBox").innerHTML=shuffled.map((opt,i)=>'<button class="'+choiceBtnClass(opt)+'" onclick="makeChoice('+i+')">'+opt.t+'</button>').join("");
  document.getElementById("resultBox").style.display="none";
  document.getElementById("historyBox").style.display="none";
  document.getElementById("nextBtn").style.display="none";
}
function resolveOpt(opt){
  if(!opt||!Array.isArray(opt.roll)||!opt.roll.length) return opt;
  let total=0;
  for(let i=0;i<opt.roll.length;i++) total+=Math.max(0,Number(opt.roll[i].w)||1);
  if(total<=0) return Object.assign({},opt,opt.roll[0]);
  let r=Math.random()*total;
  let picked=opt.roll[opt.roll.length-1];
  for(let i=0;i<opt.roll.length;i++){
    r-=Math.max(0,Number(opt.roll[i].w)||1);
    if(r<=0){picked=opt.roll[i];break;}
  }
  // roll-поля перекрывают базовые; t/tags с базы остаются, если в исходе не заданы
  const out=Object.assign({},opt,picked);
  delete out.roll;
  if(picked.tags) out.tags=picked.tags;
  else if(opt.tags) out.tags=opt.tags;
  return out;
}
function makeChoice(idx){
  if(gameOver||choiceLocked) return;
  choiceLocked=true;
  const raw=window._currentOpts[idx];
  if(!raw){choiceLocked=false;return;}
  const opt=resolveOpt(raw);
  window._currentOpts[idx]=opt;
  const q=availableQuestions[currentQuestionIndex];
  const oH=player.hp,oS=player.silver,oG=player.glory;
  player.hp+=opt.hp;player.silver+=opt.s;player.glory+=opt.g;
  clampStats();

  // Подлость: шанс 15–30% «сошло с рук» (прибыль, честь не падает)
  let bad=null;
  const tags=opt.tags||[];
  bad=applyDirtyGetaway(opt,tags);
  if(!bad){
    bad=applyBadLuck(tags);
    if(player.iron && !bad && tags.some(t=>badTags.has(t)) && Math.random()<0.35){
      player.glory-=4;
      bad={dh:0,ds:0,dg:-4,note:"В режиме хардкор ошибка дорого стоит."};
    }
  }
  clampStats();
  if(opt.family) applyFamilyChange(opt.family);
  // эвристика по тексту результата / варианта / вопроса
  const qt=(q.text||"").toLowerCase();
  const ot=(opt.t||"").toLowerCase();
  const rt=((opt.r||"")+" "+ot+" "+qt).toLowerCase();
  if(/сын умер|единственный сын умер/.test(qt)) applyFamilyChange({son:"мертв"});
  if(/отец не вышел|отца не стало|отец погиб/.test(rt)) applyFamilyChange({father:"мертв"});
  if(/старый отец просит|отпустить в монастырь|ушёл в монастырь/.test(rt) && /отец/.test(qt)) applyFamilyChange({father:"в монастыре"});
  if(/семью увели|семья потеряна|семья в бегах|семья потеряна в дыму/.test(rt)) applyFamilyChange({wife:"в бегах",son:"в бегах",daughter:"в бегах"});
  if(/жену прогнал|прогнал жену|жену с ребёнком/.test(rt)) applyFamilyChange({wife:"прогнана"});
  if(/сын ушёл с дружиной|отправил сына в поход|отдать сына в дружину|отправить сына/.test(rt)) applyFamilyChange({son:"в дружине"});
  if(/сына в холопы|забрать сына|сын в неволе|увели сына|сын ушёл в неволю|выдать сына/.test(rt)) applyFamilyChange({son:"в холопах"});
  if(/сам вместо сына|взяли тебя на год|вместо сына|сын остался дома|сын цел|сын под родной|сын свободен|сын спасён/.test(rt)) applyFamilyChange({son:"цел"});
  if(/сын вернулся из похода калекой/.test(qt) || /сын.*калек/.test(rt)) applyFamilyChange({son:"калека"});
  if(/отправить в монастырь/.test(ot) && /калек/.test(qt)) applyFamilyChange({son:"в монастыре"});
  if(/сын в учении|ушёл.*мастер|сын в учении, кошель|отпустил\. сын ушёл, дом/.test(rt)) applyFamilyChange({son:"в учении"});
  if(/прогнал\. сын ушёл|прогнать сына|связь прервана|потерял сына|сын ушёл к ней|прогнал сына совсем/.test(rt)) applyFamilyChange({son:"прогнан"});
  if(/дочь ушла к боярину|дочь отдана|взял большой выкуп/.test(rt)) applyFamilyChange({daughter:"у боярина"});
  if(/дочь в монастыре|спрятал дочь в монастыре|спрятать дочь в монастыре/.test(rt)) applyFamilyChange({daughter:"в монастыре"});
  if(/зятя/.test(qt) && !/выгнать обоих|выгнал/.test(ot+" "+(opt.r||"").toLowerCase())) applyFamilyChange({daughter:"замужем"});
  if(/дочь и зять ушли|выгнал\. дочь|выгнать обоих/.test(rt)) applyFamilyChange({daughter:"прогнана"});
  if(/потребовать законный брак/.test(ot)) applyFamilyChange({daughter:"замужем"});
  if(/убил любовника/.test(rt)) applyFamilyChange({wife:"больна"});
  if(/простить и.*ребёнка|принял ребёнка|усыновил|принял и усыновил/.test(rt)) applyFamilyChange({son:"цел"});
  if(/жена поругана/.test(rt)) applyFamilyChange({wife:"поругана"});
  if(/мор.*близких|потерял близких/.test(rt)) applyFamilyChange({wife:"больна",son:"болен",daughter:"больна"});
  if(/сын.*ранен|сын.*болен|многие пали/.test(rt) && /бой|отряд|дружин/.test(rt)) applyFamilyChange({son:"болен"});
  if(/дочь.*замуж|вышла замуж/.test(rt)) applyFamilyChange({daughter:"замужем"});
  processTags(opt.tags||[]);
  const newPlaques=considerPlaques(opt,q);
  addChronicle(opt,q);
  player.lastEvent={
    year:currentYear,
    age:player.age,
    q:q.text||"",
    choice:opt.t||"",
    result:opt.r||"",
    badNote:bad?bad.note:""
  };
  updateStatsWithAnimation(oH,oS,oG);
  document.getElementById("bioAge").innerText=player.age;

  function fmtDelta(n,label){
    if(n>0) return '<span class="delta-good">'+label+' +'+n+'</span>';
    if(n<0) return '<span class="delta-bad">'+label+' '+n+'</span>';
    return '<span class="delta-zero">'+label+' 0</span>';
  }
  let pH=0,pS=0,pG=0;
  if(newPlaques&&newPlaques.length){
    newPlaques.forEach(function(p){ pH+=p.hp|0; pS+=p.s|0; pG+=p.g|0; });
  }
  const dH=opt.hp+(bad?bad.dh:0)+pH;
  const dS=opt.s+(bad?bad.ds:0)+pS;
  const dG=opt.g+(bad?bad.dg:0)+pG;
  const deltas=[fmtDelta(dH,'❤️ здоровье'),fmtDelta(dS,'🪙 деньги'),fmtDelta(dG,'🏅 почесть')].join(' · ');
  let resHtml="<strong>Что произошло:</strong> "+opt.r;
  if(bad) resHtml+=" "+bad.note;
  if(newPlaques&&newPlaques.length){
    resHtml+="<br>"+newPlaques.map(function(p){
      const why=p.why?' <i style="color:#6a4a28">('+escapeHtml(p.why)+')</i>':"";
      return '<span style="color:#5a3a18">Перк:</span> <b>'+escapeHtml(p.title)+'</b> '+plaqueModHtml(p)+why;
    }).join("<br>");
  }
  resHtml+="<br>"+deltas;
  document.getElementById("resultBox").innerHTML=resHtml;
  document.getElementById("resultBox").style.display="block";
  if(!player.skipHistory){
    document.getElementById("historyBox").innerHTML="<strong>Историческая справка:</strong> "+q.history;
    document.getElementById("historyBox").style.display="block";
  } else {
    document.getElementById("historyBox").style.display="none";
  }
  document.getElementById("choicesBox").innerHTML="";

  if(player.hp<=0||player.silver<=0||player.glory<0||familyAllGone()){
    if(endGameTimer) clearTimeout(endGameTimer);
    endGameTimer=setTimeout(endGame,1800);
  } else {
    choiceLocked=false;
    document.getElementById("nextBtn").style.display="block";
  }
}

function nextQuestion(){
  currentQuestionIndex++;currentYear++;player.age++;
  document.getElementById("bioAge").innerText=player.age;
  tickPlaques();
  showQuestion();
}
function getLastFateStory(){
  const e=player.lastEvent;
  if(!e) return "";
  const ruined=player.hp<=0||player.silver<=0||player.glory<0||familyAllGone();
  if(!ruined) return "";

  let situ=String(e.q||"").replace(/[?？]+$/,"").trim();
  if(situ) situ=situ.charAt(0).toLowerCase()+situ.slice(1);

  let res=String(e.result||"").trim();
  if(res && !/[.!?…]$/.test(res)) res+=".";
  if(e.badNote){
    let n=String(e.badNote).trim();
    if(n && !/[.!?…]$/.test(n)) n+=".";
    if(n) res=(res?res+" ":"")+n;
  }
  if(!situ && !res) return "";

  let body="";
  if(situ && res) body="В лето "+e.year+" судьба подвела тебя к такому: "+situ+". "+res;
  else if(res) body="В лето "+e.year+" пришёл последний удар. "+res;
  else body="В лето "+e.year+" случилось: "+situ+".";

  if(familyAllGone()) return body+" Кровные узы порвались, и двор опустел.";
  if(player.glory<0) return body+" После этого сход отвернулся — и дороги назад не стало.";
  if(player.hp<=0) return body+" С этой беды ты уже не поднялся.";
  if(player.silver<=0) return body+" Казна иссякла, и свобода ушла вместе с серебром.";
  return body;
}
function getDestiny(){
  if(familyAllGone())return "Семья потеряна: кто умер, кто в бегах. Пустой двор и холодный очаг — ты остался один, и это хуже любой кабалы.";
  if(player.hp<=0)return "Твой жизненный путь оборвался преждевременно. Земля приняла тебя сурово.";
  if(player.silver<=0)return "Долговая яма сломила дух. Ты закончил дни в кабале.";
  const g=player.glory,s=player.silver,h=player.hp;
  if(g>80&&s>50)return "Легендарный муж! Имя слагают в песнях от Новгорода до Киева.";
  if(g>80)return "Посадский староста и мудрый советник. Народ чтит твою доблесть.";
  if(s>80)return "Богатейший купец. Сундуки ломятся, амбары полны.";
  if(g<10&&s<10)return "Захудалый отшельник, забытый всеми.";
  if(h>70&&g>40)return "Здоровый ветеран сходок. Сила и рассудок спасали общину.";
  if(s>40&&g>40)return "Зажиточный хозяин. Двор ухожен, слово весит золото.";
  if(g>50)return "Уважаемый советник. К тебе идут за мудростью.";
  if(s>50)return "Успешный торговец. Объездил пол-Руси.";
  if(h<25)return "Измождённый труженик. Спина согнута, почесть цела.";
  if(g<20)return "Нелюдимый мужик. Провожали без слёз.";
  if(s<20&&g>30)return "Бедный, но любимый. Соседи всегда делились.";
  if(s>30&&h<35)return "Скопидом с подорванным здоровьем.";
  if(g>30&&s>30)return "Добропорядочный семьянин и опора волости.";
  return "Обычный крестьянин-труженик. Честно пропахал свою землю и оставил добрую память.";
}
function getDestinyImage(){
  if(familyAllGone())return "грустный крестьянин";
  if(player.glory<0)return "беглый холоп";
  if(player.hp<=0)return "мор чума массовая смерть";
  if(player.silver<=0)return "рабы";
  const g=player.glory,s=player.silver,h=player.hp;
  if(g>80&&s>50)return "княз радость гордость";
  if(g>80)return "сход мужчины";
  if(s>80)return "сундук с сокровищами";
  if(g<10&&s<10)return "страшный лес";
  if(h>70&&g>40)return "богатырь охраняет";
  if(s>40&&g>40)return "крестьянин застолье";
  if(g>50)return "князь говорит";
  if(s>50)return "купец";
  if(h<25)return "болезнь мужик";
  if(g<20)return "мужчина ночь окно смотрит";
  if(s<20&&g>30)return "бедный крестьянин";
  if(s>30&&h<35)return "мужик и бочка задумался";
  if(g>30&&s>30)return "семья";
  return "работа в пшеничном поле";
}
function escapeHtml(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function scoreOf(e){ return (e.hp|0)+(e.silver|0)+(e.glory|0); }
function loadChronicle(){
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(e){ return []; }
}
function saveChronicle(list){
  try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(list)); }catch(e){}
}
function sortChronicle(list){
  return list.slice().sort(function(a,b){
    const ds=scoreOf(b)-scoreOf(a);
    if(ds) return ds;
    const dg=(b.glory|0)-(a.glory|0);
    if(dg) return dg;
    const dsil=(b.silver|0)-(a.silver|0);
    if(dsil) return dsil;
    return (b.ts|0)-(a.ts|0);
  });
}
function jobTitle(job,fallbackRank){
  const j=String(job||"").trim();
  if(!j) return fallbackRank||"Смерд";
  return j.charAt(0).toUpperCase()+j.slice(1);
}
function formatChronicleLine(e,place){
  const job=jobTitle(e.job,"");
  const rank=e.rank||getRank(e.glory|0);
  const who=job?(job+", "+rank):rank;
  return place+" "+e.name+" "+e.nickname+", "+who+" "+e.age+" лет ❤️"+e.hp+" 🪙"+e.silver+"🏅"+e.glory;
}
function renderChronicleList(list,meId){
  if(!list.length){
    return '<div class="chronicle-wrap"><div class="chronicle-title">Летопись судеб</div><div class="chronicle-empty">Пока пусто — будь первым.</div></div>';
  }
  const rows=list.map(function(e,i){
    const place=i+1;
    const me=e.id===meId;
    return '<div class="chronicle-row'+(me?" me":"")+'"'+(me?' id="chronicleMe"':"")+'>'+escapeHtml(formatChronicleLine(e,place))+'</div>';
  }).join("");
  return '<div class="chronicle-wrap" id="chronicleWrap"><div class="chronicle-title">Летопись судеб · по сумме ❤️+🪙+🏅</div>'+rows+'</div>';
}
function writeToHistory(){
  if(historyWritten||!gameOver) return;
  const entry={
    id:"r"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    name:player.name,
    nickname:player.nickname,
    job:player.job,
    rank:getRank(player.glory),
    age:player.age,
    hp:player.hp|0,
    silver:player.silver|0,
    glory:player.glory|0,
    iron:!!player.iron,
    ts:Date.now()
  };
  let list=loadChronicle();
  list.push(entry);
  list=sortChronicle(list);
  if(list.length>HISTORY_MAX) list=list.slice(0,HISTORY_MAX);
  saveChronicle(list);
  historyWritten=true;
  lastHistoryId=entry.id;
  showEndActions(true);
  document.getElementById("gameScreen").classList.add("chronicle-open");
  const host=document.getElementById("questionText");
  if(!host) return;
  const end=host.querySelector(".end-block");
  if(!end) return;
  let slot=document.getElementById("chronicleSlot");
  if(!slot){
    slot=document.createElement("div");
    slot.id="chronicleSlot";
    end.appendChild(slot);
  }
  const inList=list.some(function(e){ return e.id===entry.id; });
  slot.innerHTML=renderChronicleList(list,entry.id)+(inList?"":'<p style="font-size:13px;margin:6px 0 0;color:#6b1a1a;">Счёт слишком мал — в топ-'+HISTORY_MAX+' не вошёл, но запись была учтена при отборе.</p>');
  const me=document.getElementById("chronicleMe");
  const wrap=document.getElementById("chronicleWrap");
  if(me&&wrap){
    requestAnimationFrame(function(){
      me.scrollIntoView({block:"center",behavior:"smooth"});
    });
  }
}
function showEndActions(written){
  const box=document.getElementById("choicesBox");
  if(!box) return;
  box.className="choices ending-actions";
  const writeBtn=written
    ?'<button class="choice-btn secondary" disabled>Вписан в историю</button>'
    :'<button class="choice-btn secondary" onclick="writeToHistory()">Вписать в историю</button>';
  box.innerHTML=writeBtn+'<button class="choice-btn" onclick="location.reload()">Начать новую жизнь</button>';
}
function endGame(){
  if(gameOver) return;
  gameOver=true;choiceLocked=true;historyWritten=false;lastHistoryId=null;
  if(endGameTimer){clearTimeout(endGameTimer);endGameTimer=null;}
  document.getElementById("gameScreen").classList.remove("playing");
  const destiny=getDestiny();
  const fateStory=getLastFateStory();
  const perkBit=player.perkHistory.length?(' За глаза называли: <i>'+player.perkHistory.join(', ')+'</i>.'):'';
  const nickLine='<p style="margin:8px 0;font-size:15px;"><b>'+player.name+'</b> по прозвищу <b>'+player.nickname+'</b>, прожил '+player.age+' '+yearsWord(player.age)+'.'+perkBit+'</p>';
  document.getElementById("bioBox").style.display="none";
  document.getElementById("nameLine").style.display="none";
  document.getElementById("progressCounter").style.display="none";
  const mb=document.getElementById("modeBar"); if(mb) mb.style.display="none";
  const pitch=document.getElementById("pitchText"); if(pitch) pitch.style.display="none";
  const yh=document.querySelector(".year-header"); if(yh) yh.style.display="none";
  const ye=document.getElementById("yearEvent"); if(ye) ye.style.display="none";
  document.getElementById("historyBox").style.display="none";
  document.getElementById("gameScreen").classList.add("ending");
  const qv=document.getElementById("qVisual");
  const img=document.getElementById("qImage");
  if(qv&&img){
    const baseName=getDestinyImage();
    qv.classList.remove("splash");
    qv.classList.add("end");
    img.onload=function(){ qv.style.display="block"; };
    img.onerror=function(){ img.onerror=null; qv.style.display="none"; };
    qv.style.display="block";
    img.src=encodeURI("img/"+baseName+".jpg");
    img.alt=baseName;
  }
  const famLine='<p style="font-size:14px;margin:6px 0;">'+getFamilyStory()+'</p>';
  const ironNote=player.iron?'<p style="font-size:13px;color:#6b1a1a;margin:4px 0;">Режим: хардкор</p>':'';
  const fateLine=fateStory?'<p style="font-size:15px;line-height:1.45;margin:8px 0;">'+fateStory+'</p>':'';
  const score=player.hp+player.silver+player.glory;
  document.getElementById("questionText").innerHTML='<div class="end-block">'+nickLine+ironNote+'<p style="font-size:15px;line-height:1.45;margin:6px 0;">'+destiny+'</p>'+fateLine+famLine+'<hr style="border:1px solid #5c3d1e;margin:8px auto;width:80%;"><p style="font-size:15px;margin:6px 0;">Итоговые показатели:<br>❤️ <b>'+player.hp+'</b> &nbsp;|&nbsp; 🪙 <b>'+player.silver+'</b> &nbsp;|&nbsp; 🏅 <b>'+player.glory+'</b> · '+getRank(player.glory)+'<br><span style="font-size:14px;color:#5a3a18;">Сумма для летописи: <b>'+score+'</b></span></p><div id="chronicleSlot"></div></div>';
  showEndActions(false);
  document.getElementById("resultBox").style.display="none";
  document.getElementById("nextBtn").style.display="none";
}
startGame();
</script>
